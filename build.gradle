plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

repositories {
    mavenCentral()
}

String javaFxVersion = '17.0.7'
String operatingSystem = System.getProperty('os.name').toLowerCase(
        java.util.Locale.ROOT)
String architecture = System.getProperty('os.arch').toLowerCase(
        java.util.Locale.ROOT)
String javaFxPlatform = operatingSystem.contains('mac')
        ? architecture.contains('aarch64') || architecture.contains('arm64')
                ? 'mac-aarch64'
                : 'mac'
        : operatingSystem.contains('win')
                ? 'win'
                : operatingSystem.contains('linux')
                        ? architecture.contains('aarch64') || architecture.contains('arm64')
                                ? 'linux-aarch64'
                                : 'linux'
                        : null

if (javaFxPlatform == null) {
    throw new GradleException(
            "Unsupported operating system for JavaFX: ${operatingSystem}")
}

dependencies {
    implementation 'org.apache.commons:commons-csv:1.14.1'

    String junitVersion = '5.14.4'
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    testImplementation 'org.testfx:openjfx-monocle:17.0.10'
    testImplementation 'org.hamcrest:hamcrest:2.2'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxPlatform}")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

checkstyle {
    toolVersion = '11.0.0'
}

jacoco {
    toolVersion = '0.8.15'
}

def javaFxTestJvmArgs = [
        '--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
        '--add-exports=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
        '--add-exports=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED',
        '--add-exports=javafx.base/com.sun.javafx.logging=ALL-UNNAMED',
        '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
        '--add-opens=javafx.graphics/javafx.stage=ALL-UNNAMED',
        '--add-opens=javafx.graphics/javafx.scene=ALL-UNNAMED',
        '--enable-native-access=javafx.graphics'
]

def configureJavaFxTest = { Test testTask ->
    testTask.useJUnitPlatform()
    testTask.systemProperty 'test.runtime.classpath', [
            sourceSets.main.output.classesDirs.asPath,
            sourceSets.main.output.resourcesDir.absolutePath,
            sourceSets.test.output.classesDirs.asPath,
            configurations.testRuntimeClasspath.asPath
    ].join(File.pathSeparator)
    testTask.systemProperty 'test.monocle.path', configurations.testRuntimeClasspath
            .find { it.name.startsWith('openjfx-monocle-') }?.absolutePath
    testTask.systemProperty 'testfx.headless', 'true'
    testTask.systemProperty 'glass.platform', 'Monocle'
    testTask.systemProperty 'monocle.platform', 'Headless'
    testTask.systemProperty 'prism.order', 'sw'
    testTask.jvmArgs = javaFxTestJvmArgs
}

test {
    configureJavaFxTest(it)
    enableAssertions = true
    exclude '**/CliIntegrationTest.class'

    testLogging {
        events 'passed', 'skipped', 'failed'
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

tasks.register('clitest', Test) {
    group = 'verification'
    description = 'Runs the documented command-line regression tests.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    failFast = true
    configureJavaFxTest(it)
    enableAssertions = true
    testLogging {
        events 'passed', 'skipped', 'failed'
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = true
    }
    filter {
        includeTestsMatching 'luckynoslacky.luckyui.CliIntegrationTest'
    }
}

tasks.named('check') {
    dependsOn tasks.named('clitest')
}

tasks.register('guiTest', Test) {
    group = 'verification'
    description = 'Runs the deterministic JavaFX GUI regression tests.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    failFast = true
    configureJavaFxTest(it)
    enableAssertions = true
    testLogging {
        events 'passed', 'skipped', 'failed'
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
    filter {
        includeTestsMatching 'luckynoslacky.luckyui.gui.*Test'
    }
}

def coverageTestTasks = [
        tasks.named('test').get(),
        tasks.named('clitest').get(),
        tasks.named('guiTest').get()
]
def coverageExecutionData = files(
        "$buildDir/jacoco/test.exec",
        "$buildDir/jacoco/clitest.exec",
        "$buildDir/jacoco/guiTest.exec")

tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Generates the aggregate JaCoCo coverage report.'
    dependsOn coverageTestTasks
    executionData coverageExecutionData
    sourceSets sourceSets.main
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

tasks.register('coverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Checks aggregate JaCoCo coverage against minimum thresholds.'
    dependsOn coverageTestTasks
    executionData coverageExecutionData
    sourceSets sourceSets.main
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

application {
    mainClass = 'luckynoslacky.LuckyNoSlacky'
}

jar {
    // A lean JAR file is not needed because the shadow JAR includes dependencies.
    enabled = false
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'luckyNoSlacky-CLI.jar'

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('shadowJarGui',
        com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveFileName = 'luckyNoSlacky-GUI.jar'
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    mergeServiceFiles()

    manifest {
        attributes 'Main-Class': 'luckynoslacky.luckyui.gui.Launcher'
    }
}

tasks.register('releaseJars') {
    group = 'build'
    description = 'Builds the CLI and JavaFX GUI release JARs.'
    dependsOn shadowJar, shadowJarGui
}

run {
    standardInput = System.in
    enableAssertions = true
}

tasks.register('runGui', JavaExec) {
    group = 'application'
    description = 'Runs the LuckyNoSlacky JavaFX interface.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'luckynoslacky.luckyui.gui.Launcher'
}
